services:
  db:
    image: mysql:8.0
    container_name: inv_manaudi_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-inv_manaudi}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-f4d3s2a1}
      TZ: America/Guayaquil
    ports:
      # Expuesto solo en localhost y en 3307 para no chocar con el MySQL local (3306)
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/dumps:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-f4d3s2a1}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: inv_manaudi_web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      # 8000 ya está ocupado en el host; se usa 8012
      - "127.0.0.1:${WEB_HOST_PORT:-8012}:8000"
    volumes:
      - ./inv_manaudi:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  media_data:
